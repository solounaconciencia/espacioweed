<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡PAGO EXITOSO! | Espacio Weed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Montserrat:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --cian: #00ffff; --neon-green: #2ecc71; --bg-space: #020204; }
        body { background: var(--bg-space); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .success-card { background: rgba(10, 15, 26, 0.95); padding: 40px; border-radius: 20px; border: 1px solid var(--neon-green); box-shadow: 0 0 30px rgba(46, 204, 113, 0.2); max-width: 400px; width: 90%; }
        .icon-check { font-size: 4rem; color: var(--neon-green); margin-bottom: 20px; }
        h1 { font-family: 'Orbitron'; font-size: 1.5rem; color: var(--neon-green); margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; font-size: 0.9rem; }
        .btn-exito { display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; font-family: 'Orbitron'; font-size: 0.9rem; transition: 0.3s; border: none; cursor: pointer; }
        .btn-wa { background: var(--neon-green); color: black; }
        .btn-nave { background: transparent; color: white; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="success-card">
        <i class="fas fa-check-circle icon-check"></i>
        <h1>¡PAGO CONFIRMADO!</h1>
        <p>La transacción fue un éxito. Tu pedido ha sido registrado en la base de datos.</p>
        <a href="#" id="link-wa" class="btn-exito btn-wa"><i class="fab fa-whatsapp"></i> COORDINAR ENTREGA</a>
        <a href="index.html" class="btn-exito btn-nave"><i class="fas fa-rocket"></i> VOLVER A LA NAVE</a>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz4tyWIFGtnbdhoyBQg5ngicVxHrF88rUdNCaoG0o85G5Uf00WpiAC38OrTH3__RWa2LQ/exec";

        async function cargarPantallaExito() {
            const params = new URLSearchParams(window.location.search);
            const numMP = params.get('payment_id') || params.get('collection_id') || 'REGISTRADO';
            const numPedido = params.get('external_reference') || 'EW-WEB';
            
            let listaProductosTexto = "";
            try {
                // Leemos el carrito que guardamos antes de pagar
                let car = localStorage.getItem('weed_last_cart') || localStorage.getItem('carritoWeed') || localStorage.getItem('carrito');
                if (car) {
                    let items = JSON.parse(car);
                    listaProductosTexto = items.map(i => `• ${i.cantidad}x ${i.nombre} ($${(i.precio * i.cantidad).toLocaleString('es-CL')})`).join('%0A');
                }
            } catch(e) {
                console.log("Error leyendo carrito guardado", e);
            }

            if (!listaProductosTexto) {
                listaProductosTexto = "• Consulta de productos registrada en sistema";
            }

            try {
                const res = await fetch(API_URL + "?action=getConfig");
                const config = await res.json();
                const wa = config['WHATSAPP_ADMIN'] || config['WHATSAPP'] || '56984569569';
                const num = wa.toString().replace(/\D/g, '');

                let msg = `¡Hola Espacio Weed! Acabo de realizar una compra exitosa. 🚀%0A%0A📌 *N° de Pedido:* ${numPedido}%0A💳 *Comprobante MP:* ${numMP}%0A🛍️ *Mis Productos:*%0A${listaProductosTexto}%0A%0A*Escribo para coordinar la entrega/despacho.*`;
                
                const linkWa = document.getElementById('link-wa');
                linkWa.href = "https://wa.me/" + num + "?text=" + msg;
                // FOCUS: Fuerza apertura en ventana/pestaña nueva sin cerrar la web
                linkWa.target = "_blank";
                linkWa.rel = "noopener noreferrer";

                // Limpiamos el carrito guardado tras procesar
                localStorage.removeItem('weed_last_cart');
                localStorage.removeItem('carrito');
                localStorage.removeItem('carritoWeed');

            } catch (err) {
                console.error("Error cargando WhatsApp:", err);
            }
        }
        cargarPantallaExito();
    </script>
</body>
</html>
